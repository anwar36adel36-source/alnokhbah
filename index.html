<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1">

<meta
 name="theme-color"
 content="#002b20">

<title>النخبة للعسل والبن اليمني</title>

<style>

/* ==========================================
   الألوان والإعدادات
========================================== */

:root{

 --green:#002b20;
 --green2:#07392b;
 --gold:#d4a34e;
 --gold2:#f0c36d;
 --cream:#fffaf1;
 --white:#ffffff;
 --ink:#151c18;
 --muted:#655e52;
 --border:#d6b474;
 --red:#9b2525;
 --success:#185b37;
 --site:1180px;

}

*{
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:var(--cream);
 color:var(--ink);
 font-family:Tahoma,Arial,sans-serif;
}

body.menu-open{
 overflow:hidden;
}

img{
 max-width:100%;
 display:block;
}

button,
input{
 font-family:inherit;
}

button{
 cursor:pointer;
}

a{
 text-decoration:none;
}

.container{
 width:min(var(--site),100%);
 margin:auto;
}


/* ==========================================
   أعلى الصفحة
========================================== */

.top{
 background:var(--green);
 color:#fff;
 border-bottom:1px solid var(--gold);
}

.top-inner{
 min-height:44px;
 padding:0 18px;

 display:flex;
 align-items:center;
 justify-content:space-between;

 gap:15px;

 font-size:13px;
}

.top a{
 color:#fff;
}

.contact{
 display:inline-flex;
 align-items:center;
 gap:6px;

 border:1px solid var(--gold);

 padding:7px 11px;

 border-radius:7px;

 transition:.2s;
}

.contact:hover{
 color:var(--gold2);
}


/* ==========================================
   القائمة الرئيسية
========================================== */

.nav{
 position:sticky;
 top:0;
 z-index:100;

 background:var(--green);

 border-bottom:1px solid var(--gold);

 box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.nav-inner{
 min-height:90px;

 padding:0 18px;

 display:flex;
 align-items:center;
 justify-content:space-between;

 gap:20px;
}

.logo{
 flex-shrink:0;
}

.logo img{
 width:130px;
 height:80px;

 object-fit:contain;
}


/* ==========================================
   روابط سطح المكتب
========================================== */

.desktop-menu{
 display:flex;
 align-items:center;
 justify-content:center;
 flex-wrap:wrap;

 gap:17px;
}

.desktop-menu a{
 position:relative;

 color:#fff;

 font-size:13px;

 padding:10px 0;

 transition:.2s;
}

.desktop-menu a:hover{
 color:var(--gold2);
}


/* ==========================================
   أدوات الرأس
========================================== */

.nav-tools{
 display:flex;
 align-items:center;
 gap:8px;
}

.nav-icon{
 position:relative;

 min-width:43px;
 height:43px;

 padding:0 10px;

 display:flex;
 align-items:center;
 justify-content:center;

 border:1px solid rgba(212,163,78,.75);

 border-radius:9px;

 background:transparent;
 color:#fff;

 font-size:18px;

 cursor:pointer;

 transition:.2s;
}

.nav-icon:hover{
 background:var(--gold);
 color:var(--green);
}

.nav-count{
 position:absolute;

 top:-7px;
 right:-7px;

 min-width:21px;
 height:21px;

 padding:0 5px;

 display:grid;
 place-items:center;

 background:var(--gold);

 color:var(--green);

 border-radius:20px;

 font-size:10px;
 font-weight:bold;
}


/* ==========================================
   زر قائمة الجوال
========================================== */

.menu-button{
 display:none;

 width:43px;
 height:43px;

 border:1px solid var(--gold);

 border-radius:8px;

 background:transparent;

 color:var(--gold2);

 font-size:24px;
}


/* ==========================================
   قائمة الجوال
========================================== */

.mobile-menu{
 display:none;
}

.mobile-menu.open{
 display:flex;
 flex-direction:column;

 background:var(--green2);

 border-top:1px solid rgba(212,163,78,.35);
}

.mobile-menu a{
 color:#fff;

 padding:14px 20px;

 border-bottom:1px solid rgba(212,163,78,.2);

 font-size:14px;
}

.mobile-menu a:hover{
 background:rgba(255,255,255,.05);
 color:var(--gold2);
}


/* ==========================================
   البحث
========================================== */

.search-area{
 background:#fff;

 border-bottom:1px solid #ead8b4;
}

.search-inner{
 padding:13px 18px;

 display:flex;
 align-items:center;

 gap:10px;
}

.search-box{
 position:relative;
 flex:1;
}

.search-box input{
 width:100%;

 padding:13px 45px 13px 15px;

 border:1px solid #d8bd89;

 border-radius:10px;

 background:#fffdf8;

 color:var(--ink);

 outline:none;

 font-size:14px;
}

.search-box input:focus{
 border-color:var(--green);

 box-shadow:
  0 0 0 3px rgba(0,43,32,.07);
}

.search-icon{
 position:absolute;

 right:15px;
 top:50%;

 transform:translateY(-50%);

 pointer-events:none;

 color:var(--green);

 font-size:18px;
}

.clear-search{
 display:none;

 border:1px solid var(--border);

 border-radius:9px;

 background:#fffaf1;

 color:var(--green);

 padding:11px 15px;
}

.clear-search.show{
 display:block;
}


/* ==========================================
   البانر
========================================== */

.hero{
 width:100%;

 aspect-ratio:1024/465;

 background:
  url("images/hero-reference.jpg")
  center/cover no-repeat;

 position:relative;

 overflow:hidden;
}

.hero::after{
 content:"";

 position:absolute;
 inset:0;

 pointer-events:none;

 box-shadow:
  inset 0 -20px 40px rgba(0,0,0,.04);
}


/* ==========================================
   بطاقات الأقسام
========================================== */

.categories{
 padding:25px 18px;
}

.category-grid{
 display:grid;

 grid-template-columns:
  repeat(5,minmax(0,1fr));

 gap:12px;
}

.category{
 background:#fffdf8;

 border:1px solid #d7b777;

 border-radius:15px;

 padding:10px;

 text-align:center;

 color:var(--ink);

 transition:
  transform .2s,
  box-shadow .2s,
  border-color .2s;
}

.category:hover{
 transform:translateY(-4px);

 border-color:var(--gold);

 box-shadow:
  0 8px 22px rgba(0,43,32,.08);
}

.category img{
 width:100%;
 height:125px;

 object-fit:cover;

 border-radius:10px;

 background:#fffaf1;
}

.category b{
 display:block;

 margin:8px 0 4px;

 color:var(--green);
}

.category small{
 color:#665e52;

 line-height:1.5;
}


/* ==========================================
   عنوان نتائج البحث
========================================== */

.search-status{
 display:none;

 margin:0 18px 20px;

 padding:14px;

 background:#fff;

 border:1px solid var(--border);

 border-radius:12px;

 text-align:center;

 color:var(--green);
}

.search-status.show{
 display:block;
}


/* ==========================================
   أقسام المنتجات
========================================== */

.product-section{
 padding:10px 18px 35px;

 scroll-margin-top:160px;
}

.section-title{
 text-align:center;

 color:var(--green);

 font-size:28px;

 margin:15px 0 22px;
}

.section-title::before,
.section-title::after{
 content:"✧";

 color:var(--gold);

 margin:0 10px;
}

.products{
 display:grid;

 grid-template-columns:
  repeat(4,minmax(0,1fr));

 gap:14px;
}


/* ==========================================
   بطاقة المنتج
========================================== */

.card{
 position:relative;

 background:#fffdf7;

 border:1px solid var(--border);

 border-radius:14px;

 overflow:hidden;

 transition:
  transform .2s,
  box-shadow .2s;
}

.card:hover{
 transform:translateY(-3px);

 box-shadow:
  0 10px 25px rgba(0,43,32,.08);
}

.product-link{
 display:block;

 color:inherit;

 overflow:hidden;
}

.image-wrap{
 position:relative;

 width:100%;

 aspect-ratio:1/1;

 overflow:hidden;

 background:#f7f0e5;

 display:grid;
 place-items:center;
}

.product-image{
 width:100%;
 height:100%;

 object-fit:cover;

 transition:transform .25s ease;
}

.product-link:hover .product-image{
 transform:scale(1.035);
}

.image-error{
 padding:20px;

 text-align:center;

 color:#756b5b;

 font-size:12px;
}


/* ==========================================
   معلومات المنتج
========================================== */

.card-body{
 padding:12px;
}

.card h3{
 margin:0 0 7px;

 font-size:17px;

 line-height:1.5;
}

.product-name-link{
 color:var(--ink);
}

.product-name-link:hover{
 color:var(--green2);
}

.description{
 margin:0 0 10px;

 min-height:40px;

 color:var(--muted);

 font-size:12px;

 line-height:1.7;
}


/* ==========================================
   المفضلة
========================================== */

.heart{
 position:absolute;

 top:9px;
 right:9px;

 z-index:5;

 width:37px;
 height:37px;

 border:1px solid var(--gold);

 border-radius:50%;

 background:var(--green2);

 color:#fff;

 font-size:20px;

 display:grid;
 place-items:center;
}

.heart:hover{
 transform:scale(1.06);
}

.heart.liked{
 background:var(--gold);

 color:var(--green);
}


/* ==========================================
   الأوزان
========================================== */

.weights{
 display:flex;

 flex-wrap:wrap;

 gap:5px;
}

.weight{
 border:1px solid #d7bd8d;

 border-radius:14px;

 padding:6px 9px;

 background:#fffaf0;

 color:var(--ink);

 font-size:11px;
}

.weight:hover{
 border-color:var(--green);
}

.weight.selected{
 background:var(--gold);

 color:var(--green);

 border-color:var(--green);

 font-weight:bold;
}

.no-weights{
 color:#756b5b;

 font-size:11px;

 padding:5px 0;
}


/* ==========================================
   زر الإضافة
========================================== */

.buy{
 width:100%;

 margin-top:11px;

 padding:11px;

 border:0;

 border-radius:8px;

 background:var(--green);

 color:#fff;

 font-weight:bold;

 transition:.2s;
}

.buy:hover{
 background:var(--green2);
}

.buy:disabled{
 cursor:not-allowed;

 opacity:.55;
}


/* ==========================================
   القسم الفارغ
========================================== */

.empty-section{
 grid-column:1/-1;

 padding:30px;

 text-align:center;

 color:#766b5a;

 background:#fffdf8;

 border:1px dashed #d7b777;

 border-radius:12px;
}


/* ==========================================
   لا توجد نتائج بحث
========================================== */

.no-results{
 display:none;

 margin:20px 18px 35px;

 padding:45px 20px;

 background:#fff;

 border:1px solid var(--border);

 border-radius:15px;

 text-align:center;
}

.no-results.show{
 display:block;
}

.no-results-icon{
 font-size:45px;

 margin-bottom:10px;
}

.no-results h2{
 color:var(--green);

 margin:0 0 8px;
}

.no-results p{
 color:#6d6559;

 margin:0;
}


/* ==========================================
   المميزات
========================================== */

.benefits{
 margin:10px 18px 30px;

 padding:18px;

 display:grid;

 grid-template-columns:
  repeat(4,1fr);

 background:var(--green);

 color:#fff;

 border-radius:18px;
}

.benefit{
 text-align:center;

 padding:10px;

 line-height:1.6;
}

.benefit b{
 display:block;

 color:var(--gold2);

 margin-bottom:6px;
}


/* ==========================================
   السلة العائمة
========================================== */

.cart{
 position:fixed;

 left:20px;
 bottom:20px;

 z-index:200;

 width:58px;
 height:58px;

 display:grid;
 place-items:center;

 background:var(--green2);

 color:#fff;

 border:1px solid var(--gold);

 border-radius:50%;

 font-size:24px;

 box-shadow:
  0 7px 20px rgba(0,0,0,.18);

 transition:.2s;
}

.cart:hover{
 transform:translateY(-3px);

 background:var(--green);
}

.cart-count{
 position:absolute;

 top:-6px;
 right:-5px;

 min-width:22px;
 height:22px;

 padding:0 5px;

 display:grid;
 place-items:center;

 border-radius:20px;

 background:var(--gold);

 color:var(--green);

 font-size:11px;

 font-weight:bold;
}


/* ==========================================
   رسالة الإشعار
========================================== */

.toast{
 position:fixed;

 right:20px;
 bottom:20px;

 z-index:1000;

 max-width:340px;

 padding:14px 18px;

 background:var(--green);

 color:#fff;

 border:1px solid var(--gold);

 border-radius:10px;

 box-shadow:
  0 10px 30px rgba(0,0,0,.2);

 opacity:0;

 visibility:hidden;

 transform:translateY(15px);

 transition:.25s;

 font-size:13px;

 line-height:1.7;
}

.toast.show{
 opacity:1;

 visibility:visible;

 transform:translateY(0);
}


/* ==========================================
   الجوال والتابلت
========================================== */

@media(max-width:950px){

 .desktop-menu{
  display:none;
 }

 .menu-button{
  display:block;
 }

 .nav-inner{
  min-height:76px;
 }

 .logo img{
  width:100px;
  height:68px;
 }

 .category-grid{
  grid-template-columns:
   repeat(3,1fr);
 }

 .products{
  grid-template-columns:
   repeat(3,1fr);
 }

}


/* ==========================================
   الشاشات المتوسطة
========================================== */

@media(max-width:700px){

 .category-grid{
  grid-template-columns:
   repeat(2,1fr);
 }

 .products{
  grid-template-columns:
   repeat(2,1fr);
 }

 .benefits{
  grid-template-columns:
   repeat(2,1fr);
 }

 .hero{
  aspect-ratio:390/220;
 }

}


/* ==========================================
   الجوال
========================================== */

@media(max-width:450px){

 .top-inner{
  justify-content:center;

  font-size:11px;
 }

 .shipping{
  display:none;
 }

 .nav-inner{
  padding:0 10px;
 }

 .nav-tools{
  gap:5px;
 }

 .nav-icon{
  min-width:38px;
  height:38px;

  padding:0 7px;

  font-size:16px;
 }

 .menu-button{
  width:38px;
  height:38px;

  font-size:21px;
 }

 .logo img{
  width:85px;
  height:60px;
 }

 .search-inner{
  padding:10px;
 }

 .categories,
 .product-section{
  padding-left:10px;
  padding-right:10px;
 }

 .category img{
  height:100px;
 }

 .section-title{
  font-size:21px;
 }

 .section-title::before,
 .section-title::after{
  margin:0 5px;
 }

 .card h3{
  font-size:14px;
 }

 .card-body{
  padding:9px;
 }

 .description{
  min-height:34px;

  font-size:10px;
 }

 .weight{
  font-size:9px;

  padding:5px 6px;
 }

 .buy{
  font-size:11px;

  padding:9px 5px;
 }

 .heart{
  width:32px;
  height:32px;

  font-size:17px;
 }

 .benefits{
  margin-left:10px;
  margin-right:10px;

  padding:10px;
 }

 .benefit{
  font-size:11px;
 }

 .cart{
  width:50px;
  height:50px;

  left:14px;
  bottom:14px;
 }

 .toast{
  right:10px;
  left:10px;

  bottom:75px;

  max-width:none;
 }

}

</style>

</head>

<script>

/* ==================================================
   الإعدادات
================================================== */

const PRODUCT_STORAGE_KEY =
 "eliteProducts";

const CATEGORY_STORAGE_KEY =
 "eliteCategories";

const DEFAULT_SETTINGS = {

 logo:
  "logo-transparent.png"

};


/* ==================================================
   المنتجات الأساسية
================================================== */

const defaultProducts = [

 {
  id:"sidr-royal",
  name:"عسل السدر الملكي",
  image:"sidr-royal.jpeg",
  description:
   "عسل سدر يمني طبيعي فاخر مختار بعناية.",
  weights:[
   "500 جم",
   "1 كجم",
   "3 كجم",

/* ==================================================
   أدوات عامة
================================================== */

function cloneData(data){

 return JSON.parse(
  JSON.stringify(data)
 );

}


function safeParse(
 value,
 fallback
){

 try{

  const parsed =
   JSON.parse(value);

  return parsed ?? fallback;

 }catch(error){

  return fallback;

 }

}


/* ==================================================
   تنظيف النصوص قبل إدخالها في HTML
================================================== */

function escapeHTML(value){

 return String(
  value ?? ""
 )
 .replaceAll(
  "&",
  "&amp;"
 )
 .replaceAll(
  "<",
  "&lt;"
 )
 .replaceAll(
  ">",
  "&gt;"
 )
 .replaceAll(
  '"',
  "&quot;"
 )
 .replaceAll(
  "'",
  "&#039;"
 );

}


/* ==================================================
   الصور
================================================== */

function getImageSource(image){

 if(!image){
  return "";
 }


 const value =
  String(image);


 if(
  value.startsWith(
   "data:image/"
  )
 ){

  return value;

 }


 /*
 السماح أيضاً بالرابط الكامل
 في المستقبل.
 */

 if(
  value.startsWith("http://") ||
  value.startsWith("https://") ||
  value.startsWith("blob:")
 ){

  return value;

 }


 /*
 إذا كان المسار يبدأ images/
 لا نكرره.
 */

 if(
  value.startsWith(
   "images/"
  )
 ){

  return value;

 }


 return "images/" + value;

}

/* ==================================================
   تحميل المنتجات من Cloudflare API
   لا نحذف أي بيانات قديمة: عند فشل الاتصال نرجع
   مباشرة إلى getStoreProducts() الموجودة أصلًا.
================================================== */

async function loadProductsFromAPI(){

 try{

  const response = await fetch(
   PRODUCTS_API_URL,
   { cache:"no-store" }
  );

  if(!response.ok){
   throw new Error(
    "HTTP " + response.status
   );
  }

  const data = await response.json();

  const apiProducts =
   Array.isArray(data)
    ? data
    : (
      data &&
      data.success &&
      Array.isArray(data.products)
       ? data.products
       : []
     );

  if(apiProducts.length){

   /*
    نحفظ آخر نسخة ناجحة محليًا أيضًا، حتى يبقى
    المتجر يعمل إذا تعذر الاتصال بالـ API لاحقًا.
   */
   try{
    localStorage.setItem(
     PRODUCT_STORAGE_KEY,
     JSON.stringify(apiProducts)
    );
   }catch(error){
    console.error(
     "Product cache error:",
     error
    );
   }

   return apiProducts;
  }

  throw new Error(
   "API returned no products"
  );

 }catch(error){

  console.error(
   "API Error:",
   error
  );

  return getStoreProducts();
 }

}

/* ==================================================
   تبديل المفضلة
================================================== */

function toggleFavorite(
 productId
){

 let favorites =
  getFavorites();


 const exists =
  favorites.some(
   id=>
    String(id) ===
    String(productId)
  );


 if(exists){

  favorites =
   favorites.filter(
    id=>
     String(id) !==
     String(productId)
   );


  showToast(
   "تمت إزالة المنتج من المفضلة."
  );

 }else{

  favorites.push(
   productId
  );


  showToast(
   "تمت إضافة المنتج إلى المفضلة ♥"
  );

 }


 if(
  saveFavorites(
   favorites
  )
 ){

  updateCounts();

 }


 /*
 إذا كنا نعرض المفضلة فقط،
 نعيد الرسم بعد إزالة منتج.
 */

 if(favoritesOnly){

  renderProducts();

 }

}

 );

 );


 return card;

/* ==================================================
   البحث في المنتج
================================================== */

function productMatchesSearch(
 product,
 search
){

 if(!search){
  return true;
 }


 const category =
  categories.find(
   item=>
    String(item.id) ===
    String(product.category)
  );


 const haystack = [

  product.name,
  product.description,
  product.category,
  category?.title,
  category?.description,
  ...(Array.isArray(product.weights)
    ? product.weights
    : [])

 ]
 .join(" ")
 .toLowerCase();


 return haystack.includes(
  search.toLowerCase()
 );

}

    }

  );


 let totalVisible =

 categories.forEach(

    );


   if(!section){
    return;
   }


   const grid =
    section.querySelector(

    );


   grid.innerHTML =
    "";


   const categoryProducts =
    visibleProducts.filter(
     product=>
      String(product.category) ===
      String(category.id)
    );


   /*
   أثناء البحث أو عرض المفضلة:
   نخفي القسم الذي لا يحتوي نتائج.
   */

   if(
    currentSearch ||
    favoritesOnly
   ){

    section.style.display =
     categoryProducts.length
      ? ""
      : "none";

   }else{

    section.style.display =
     "";

   }


   if(!categoryProducts.length){

    if(
     !currentSearch &&
     !favoritesOnly
    ){

     const empty =
      document.createElement(
       "div"
      );


     empty.className =
      "empty-section";


     empty.textContent =
      "سيتم إضافة المنتجات قريبًا";


     grid.appendChild(
      empty
     );

    }


    return;

   }


   categoryProducts.forEach(
    product=>{

     grid.appendChild(
      createCard(product)
     );


     totalVisible++;

    }
   );

  }
 );


 /*
 رسالة لا توجد نتائج
 */

 const noResults =
  document.getElementById(
   "noResults"
  );


 if(
  (
   currentSearch ||
   favoritesOnly
  )
  &&
  totalVisible === 0
 ){

  noResults.classList.add(
   "show"
  );

 }else{

  noResults.classList.remove(
   "show"
  );

 }


 updateSearchStatus(
  totalVisible
 );

}


/* ==================================================
   حالة البحث والمفضلة
================================================== */

function updateSearchStatus(
 total
){

 const status =
  document.getElementById(
   "searchStatus"
  );


 if(
  !currentSearch &&
  !favoritesOnly
 ){

  status.classList.remove(
   "show"
  );


  status.textContent =
   "";


  return;

 }


 let text = "";


 if(
  currentSearch &&
  favoritesOnly
 ){

  text =
   `نتائج البحث في المفضلة عن "${currentSearch}" — ${total} منتج`;

 }else if(currentSearch){

  text =
   `نتائج البحث عن "${currentSearch}" — ${total} منتج`;

 }else{

  text =
   `المنتجات المفضلة — ${total} منتج`;

 }


 status.textContent =
  text;


 status.classList.add(
  "show"
 );

}


/* ==================================================
   إضافة إلى السلة
================================================== */

function addToCart(
 product,
 weight
){

 const cart =
  getCart();


 const existing =
  cart.find(
   item=>

    String(item.id) ===
    String(product.id)

    &&

    String(item.weight) ===
    String(weight)

  );


 if(existing){

  existing.quantity =
   Number(
    existing.quantity || 1
   ) + 1;

 }else{

  cart.push({

   id:
    product.id,

   name:
    product.name,

   image:
    getImageSource(
     product.image
    ),

   weight:
    weight,

   quantity:
    1,

   category:
    product.category

  });

 }


 if(
  saveCart(cart)
 ){

  updateCounts();


  showToast(
   "تمت إضافة المنتج إلى السلة بنجاح ✓"
  );

 }

}


/* ==================================================
   البحث
================================================== */

const searchInput =
 document.getElementById(
  "productSearch"
 );


const clearSearchButton =
 document.getElementById(
  "clearSearch"
 );


searchInput.addEventListener(
 "input",
 function(){

  currentSearch =
   this.value.trim();


  clearSearchButton
   .classList
   .toggle(
    "show",
    Boolean(currentSearch)
   );


  renderProducts();

 }
);


clearSearchButton.addEventListener(
 "click",
 ()=>{

  searchInput.value =
   "";


  currentSearch =
   "";


  clearSearchButton
   .classList
   .remove(
    "show"
   );


  renderProducts();


  searchInput.focus();

 }
);


/* ==================================================
   عرض المفضلة
================================================== */

document
.getElementById(
 "favoritesButton"
)
.addEventListener(
 "click",
 ()=>{

  favoritesOnly =
   !favoritesOnly;


  const button =
   document.getElementById(
    "favoritesButton"
   );


  button.style.background =
   favoritesOnly
    ? "var(--gold)"
    : "";


  button.style.color =
   favoritesOnly
    ? "var(--green)"
    : "";


  renderProducts();


  document
   .getElementById(
    "productSections"
   )
   .scrollIntoView({

    behavior:"smooth",
    block:"start"

   });

 }
);


/* ==================================================
   قائمة الجوال
================================================== */

const menuButton =
 document.getElementById(
  "menuButton"
 );


const mobileMenu =
 document.getElementById(
  "mobileMenu"
 );


menuButton.addEventListener(
 "click",
 ()=>{

  const opened =
   mobileMenu.classList.toggle(
    "open"
   );


  menuButton.setAttribute(
   "aria-expanded",
   String(opened)
  );


  menuButton.textContent =
   opened
    ? "✕"
    : "☰";

 }
);


mobileMenu.addEventListener(
 "click",
 event=>{

  if(
   event.target.closest("a")
  ){

   mobileMenu.classList.remove(
    "open"
   );


   menuButton.setAttribute(
    "aria-expanded",
    "false"
   );


   menuButton.textContent =
    "☰";

  }

 }
);


/* ==================================================
   إغلاق قائمة الجوال عند تكبير الشاشة
================================================== */

window.addEventListener(
 "resize",
 ()=>{

  if(
   window.innerWidth > 950
  ){

   mobileMenu.classList.remove(
    "open"
   );


   menuButton.setAttribute(
    "aria-expanded",
    "false"
   );


   menuButton.textContent =
    "☰";

  }

 }
);


/* ==================================================
   المزامنة مع لوحة الإدارة
================================================== */

window.addEventListener(
 "storage",
 event=>{

  const watchedKeys = [

   PRODUCT_STORAGE_KEY,
   CATEGORY_STORAGE_KEY,
   BANNER_STORAGE_KEY,
   SETTINGS_STORAGE_KEY,
   CART_STORAGE_KEY,
   FAVORITES_STORAGE_KEY

  ];


  if(
   watchedKeys.includes(
    event.key
   )
  ){

   /*
   نعيد تحميل البيانات بدون
   الحاجة لإعادة تحميل الصفحة كاملة.
   */

   refreshStore();

  }

 }
);


/* ==================================================
   تحديث المتجر
================================================== */

 categories =

 products =
  await loadProductsFromAPI();


 renderSettings();

 renderStoreBanner();

 renderCategories();

 renderMenus();

 createProductSections();

 renderProducts();

 updateCounts();

}


/* ==================================================
   تحديث عند الرجوع للصفحة
================================================== */

window.addEventListener(
 "pageshow",
 ()=>{

  updateCounts();

 }
);


/* ==================================================
   تشغيل المتجر
================================================== */

refreshStore();

</script>
